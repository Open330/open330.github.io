name: Update projects

on:
  schedule:
    - cron: '0 1 * * *' # daily, ~1h after the org feed regenerates at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-projects
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render projects section
        run: node scripts/build-projects.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.html data/projects.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/projects.json
          git commit -m "chore(projects): refresh projects section from org feed"
          git push
